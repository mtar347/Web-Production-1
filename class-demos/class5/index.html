
<html>
<head>

<link rel="stylesheet"  href="style.css">
<title>Class 5</title>	
</head>
<body>
	<!-- divs are used as containers or dividing elements to group sections of content together -->
	
	<div class="container">
		<p>position static</p>
		<div class="static-child"></div>
	</div>
	<div class="container">
		<p>postion relative</p>
		<div class="relative-child"></div>
	</div>
	<div class="container">
		<p>position absolute</p>
		<div class="absolute-child"></div>
	</div>
	<div class="container relative-parent">
		<p>position absolute with parent relative</p>
		<div class="absolute-child"></div>
	</div>
	<div class="container">
		<p>postion: fixed</p>
		<div class="fixed-child"></div>
	</div>
		<div class="container down-under">
		<p>position: sticky</p>
	</div>
		<div class="sticky-child"></div>

		<div class="big-container">
		<img src="documentation_images/keyboard.png">
	</div>


</body>
</html>
